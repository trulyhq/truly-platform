# .github/workflows/deploy-mobile-staging.yml
# Builds mobile app for STAGING (internal testing) on push to main.
# Temporarily builds Android only while iOS credentials are being set up.
name: Deploy Mobile (Staging)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/ui/**"
      - "packages/trpc/**"
      - "packages/validators/**"
  workflow_dispatch:

concurrency:
  group: deploy-mobile-staging
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build (Staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate EXPO_TOKEN is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Missing EXPO_TOKEN secret in GitHub Environment: staging"
            echo "   Go to: Settings → Environments → staging → Secrets"
            exit 1
          fi

      - name: Validate EAS project is initialized
        working-directory: apps/mobile
        run: |
          PROJECT_ID=$(node -e "const fs=require('fs');const app=JSON.parse(fs.readFileSync('app.json','utf8'));process.stdout.write(app?.expo?.extra?.eas?.projectId||'');")
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ EAS project is not initialized for apps/mobile"
            echo "   Run once locally: cd apps/mobile && npx eas-cli init"
            echo "   Then commit app.json (with expo.extra.eas.projectId) and eas.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build for staging (internal)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile staging --platform android --non-interactive
