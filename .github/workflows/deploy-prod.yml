# .github/workflows/deploy-prod.yml
# Deploys API + Web + Landing to PRODUCTION on push to prod branch.
# Account: Prod (562590526970) | SST stage: prod
name: Deploy Production

on:
  push:
    branches: [prod]
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - "apps/landing/**"
      - "packages/**"
      - "sst.config.ts"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build all packages
        run: npx turbo run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy SST (prod)
        run: npx sst deploy --stage prod

      - name: Set DATABASE_URL secret
        run: bash scripts/set-dburl.sh
        env:
          SST_STAGE: prod
          AWS_REGION: eu-west-1

      - name: Health check
        run: |
          echo "Waiting 15s for deployment to stabilize..."
          sleep 15
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://api.mytruly.app/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "⚠️ Health check returned HTTP $STATUS (may need time to warm up)"
          fi
